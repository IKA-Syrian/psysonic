# Fork-only workflow: builds the Windows installer from this branch and keeps it
# as a downloadable artifact on the run page. No signing keys or releases needed.
name: Fork Windows build

on:
  workflow_dispatch:
  push:
    branches: [covers]

permissions:
  contents: read

concurrency:
  group: fork-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "npm"
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: install npm dependencies
        run: npm install
      - name: build installer
        run: npm run tauri -- build --bundles nsis
      - name: upload installer
        uses: actions/upload-artifact@v7
        with:
          name: psysonic-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
